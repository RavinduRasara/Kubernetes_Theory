apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-with-auth
spec:
  rules:
  - host: hogwarts.middle.earth
    http:
      paths:
      - path: /first
        pathType: Prefix
        backend:
          service:
            name: hogwarts-service
            port:
              number: 80
      - path: /second
        pathType: Prefix
        backend:
          service:
            name: middle-earth-service
            port:
              number: 80
